name: Test Run JARVIS OS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

env:
  CARGO_TERM_COLOR: always

jobs:
  test-run:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        toolchain: nightly
        components: rust-src, llvm-tools-preview
        override: true

    - name: Install QEMU
      run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "jarvis-os-test"

    - name: Build Kernel
      run: cargo build --bin jarvis-kernel --target x86_64-jarvis_os.json -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec

    - name: Create Disk Image
      run: cargo run --bin create_image --target x86_64-unknown-linux-gnu -Zjson-target-spec

    - name: Boot Test (QEMU)
      run: |
        echo "Starting QEMU Boot Test..."
        # Run QEMU and expect "BOOT_READY" in the first 30 seconds
        timeout 30s qemu-system-x86_64 \
          -drive format=raw,file=target/image/jarvis-os.img \
          -display none \
          -serial stdio | tee qemu_output.log
        
        if grep -q "BOOT_READY" qemu_output.log; then
          echo "Boot Test PASSED"
        else
          echo "Boot Test FAILED: 'BOOT_READY' not found in output"
          cat qemu_output.log
          exit 1
        fi
