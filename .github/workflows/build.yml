name: Build & Verify JARVIS OS

on:
  push:
    branches: [ "main", "develop", "feat/*" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: JRV Validation (Formal Proofs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies (NASM & QEMU for AArch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-user-static

      - name: Run Validation Script (via QEMU)
        run: |
          # Use qemu-aarch64-static to run the jrvc binary
          # We need to wrap the jrvc call in the script or use binfmt_misc (which qemu-user-static should set up)
          ./scripts/validate.sh
