name: Build JARVIS OS

on:
  push:
    branches: [ "main", "develop", "feat/*" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        toolchain: nightly
        components: rust-src, llvm-tools-preview

    - name: Install QEMU
      run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

    - name: Force Stable Dependencies
      run: |
        cargo generate-lockfile
        # Force stable versions in the workspace lockfile
        cargo update -p serde --precise 1.0.210
        cargo update -p rustix --precise 0.38.31

    - name: Run Framework Tests
      run: |
        # Build the kernel with test feature
        cargo build --bin jarvis-kernel --features test --target x86_64-jarvis_os.json \
          -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec
        
        # Run using image-builder as runner
        cargo run -p image-builder --target x86_64-unknown-linux-gnu -- \
          target/x86_64-jarvis_os/debug/jarvis-kernel

    - name: Build Production Kernel
      run: |
        cargo build --bin jarvis-kernel --target x86_64-jarvis_os.json \
          -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec

    - name: Create Production Disk Image
      run: |
        cargo run -p image-builder --target x86_64-unknown-linux-gnu

    - name: Upload Disk Image
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-os-image
        path: target/image/jarvis-os.img
