name: Build JARVIS OS

on:
  push:
    branches: [ "main", "develop", "feat/*" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        machine: [q35, pc]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        toolchain: nightly
        components: rust-src, llvm-tools-preview

    - name: Install QEMU and Tools
      run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ffmpeg

    - name: Force Stable Dependencies
      run: |
        # Fix serde for both projects
        cargo generate-lockfile
        cargo update -p serde --precise 1.0.227 || true
        
        cd image-builder
        cargo generate-lockfile
        cargo update -p serde --precise 1.0.227 || true
        # Fix rustix for the host tools
        cargo update -p rustix --precise 0.38.31 || true

    - name: Run Framework Tests
      run: |
        # Build the kernel with test feature
        cargo build --bin jarvis-kernel --features test --target x86_64-jarvis_os.json \
          -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec
        
        # Build and run image-builder separately
        cd image-builder
        cargo run --target x86_64-unknown-linux-gnu -- \
          ../target/x86_64-jarvis_os/debug/jarvis-kernel --machine ${{ matrix.machine }} --memory 512

    - name: Build Production Kernel
      run: |
        cargo build --bin jarvis-kernel --target x86_64-jarvis_os.json \
          -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec

    - name: Create Production Disk Image
      run: |
        cd image-builder
        cargo run --target x86_64-unknown-linux-gnu -- \
          ../target/x86_64-jarvis_os/debug/jarvis-kernel --no-run

    - name: Upload Disk Image
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-os-image-${{ matrix.machine }}
        path: target/image/jarvis-os.img

    - name: Convert and Upload Screenshots
      if: always()
      run: |
        mkdir -p target/screenshots
        for f in target/screenshot_*.ppm; do
          if [ -f "$f" ]; then
            filename=$(basename "$f" .ppm)
            ffmpeg -i "$f" "target/screenshots/${filename}.png" -y
          fi
        done

    - name: Upload Screenshots
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: qemu-screenshots-${{ matrix.machine }}
        path: target/screenshots/*.png

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Disk Image
        uses: actions/download-artifact@v4
        with:
          name: jarvis-os-image-pc
          path: target/image/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
