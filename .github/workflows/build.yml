name: Build & Verify JARVIS OS

on:
  push:
    branches: [ "main", "develop", "feat/*" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: JRV Validation (Formal Proofs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies (NASM, QEMU & AArch64 Libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-user-static libc6-arm64-cross

      - name: Run Validation Script (via QEMU)
        run: |
          # Use qemu-aarch64-static with the correct library path
          export QEMU_LD_PREFIX=/usr/aarch64-linux-gnu
          ./scripts/validate.sh
