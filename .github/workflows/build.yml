name: Build JARVIS OS

on:
  push:
    branches: [ "main", "develop", "feat/*" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        toolchain: nightly
        components: rust-src, llvm-tools-preview
        override: true

    - name: Install QEMU
      run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

    - name: Build Kernel
      run: cargo build --target x86_64-unknown-none -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem

    - name: Create Disk Image
      run: cargo run --bin create_image --target x86_64-unknown-linux-gnu

    - name: Boot Test (QEMU)
      run: |
        timeout 30s qemu-system-x86_64 \
          -drive format=raw,file=target/image/jarvis-os.img \
          -display none \
          -serial stdio \
          | grep -q "BOOT_READY"

    - name: Upload Disk Image
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-os-image
        path: target/image/jarvis-os.img
