name: Build & Verify JARVIS OS

on:
  push:
    branches: [ "main", "develop", "feat/*" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --cfg curve25519_dalek_backend="u64"

jobs:
  validate:
    name: Lint & Format (Fail Fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview, rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      
      - name: Force Stable Dependencies
        run: |
          cargo generate-lockfile
          cargo update -p serde --precise 1.0.227 || true
          cd image-builder
          cargo generate-lockfile
          cargo update -p serde --precise 1.0.227 || true
          cargo update -p rustix --precise 0.38.31 || true

      - name: Check Formatting
        run: cargo fmt -- --check
        
      - name: Clippy (Default Features)
        run: cargo clippy -Zbuild-std=core,alloc --target x86_64-jarvis_os.json -Zjson-target-spec -- -D warnings
        
      - name: Clippy (All Features)
        run: cargo clippy --all-features -Zbuild-std=core,alloc --target x86_64-jarvis_os.json -Zjson-target-spec -- -D warnings

  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v1.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: QEMU Integration Tests
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        machine: [q35, pc]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      - name: Install QEMU and FFmpeg
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ffmpeg

      - name: Build & Run Tests
        run: |
          # Build kernel
          cargo build --bin jarvis-kernel --features test --target x86_64-jarvis_os.json \
            -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec
          
          # Run via image-builder
          cd image-builder
          cargo run --target x86_64-unknown-linux-gnu -- \
            ../target/x86_64-jarvis_os/debug/jarvis-kernel --machine ${{ matrix.machine }} --memory 512

      - name: Convert & Upload Screenshots
        if: always()
        run: |
          mkdir -p target/screenshots
          for f in target/screenshot_*.ppm; do
            if [ -f "$f" ]; then
              filename=$(basename "$f" .ppm)
              ffmpeg -i "$f" "target/screenshots/${filename}.png" -y
            fi
          done

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-screenshots-${{ matrix.machine }}
          path: target/screenshots/*.png

  build_production:
    name: Production Build
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        machine: [q35, pc]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      - name: Build Kernel
        run: |
          cargo build --bin jarvis-kernel --target x86_64-jarvis_os.json \
            -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec

      - name: Create Disk Image
        run: |
          cd image-builder
          cargo run --target x86_64-unknown-linux-gnu -- \
            ../target/x86_64-jarvis_os/debug/jarvis-kernel --no-run

      - name: Upload Disk Image
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-os-image-${{ matrix.machine }}
          path: target/image/jarvis-os.img

  publish_ghcr:
    name: Publish to GHCR
    needs: build_production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Download Disk Image
        uses: actions/download-artifact@v4
        with:
          name: jarvis-os-image-pc
          path: target/image/

      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
