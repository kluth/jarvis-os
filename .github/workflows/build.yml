name: Build & Verify JARVIS OS

on:
  push:
    branches: [ "main", "develop", "feat/*" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: JRV Validation (Formal Proofs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies (QEMU & AArch64 Libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static libc6-arm64-cross libgcc-s1-arm64-cross

      - name: Run Validation Script (via QEMU)
        run: |
          export QEMU_LD_PREFIX=/usr/aarch64-linux-gnu
          ./scripts/validate.sh

  test:
    name: QEMU Integration Tests (${{ matrix.machine }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        machine: [q35, pc]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies (QEMU & Rust toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 nasm

      - name: Install Rust nightly with llvm-tools
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: llvm-tools-preview, rust-src, rustfmt, clippy

      - name: Install cargo-bootimage
        run: cargo install bootimage 2>&1 | tail -3

      - name: Build JRV Substrate (Formal Proofs)
        run: |
          export QEMU_LD_PREFIX=/usr/aarch64-linux-gnu
          ./scripts/build.sh

      - name: Build Rust kernel + Bootable Image
        run: |
          cargo bootimage --target x86_64-jarvis_os.json -Zbuild-std=core,alloc 2>&1
          # The bootimage crate outputs: target/x86_64-jarvis_os/debug/bootimage-jarvis-kernel.bin
          cp target/x86_64-jarvis_os/debug/bootimage-jarvis-kernel.bin jarvis-os.img

      - name: QEMU Integration Boot Test
        run: |
          qemu-system-x86_64 \
            -drive format=raw,file=jarvis-os.img \
            -machine ${{ matrix.machine }} \
            -display none \
            -serial stdio \
            -no-reboot \
            -m 256M \
            -d cpu_reset \
            | head -100 || [ $? -eq 1 ]  # QEMU exit 1 = reboot/halt, which is expected for kernel tests

  publish_ghcr:
    name: Publish to GHCR
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies (QEMU & AArch64 Libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static libc6-arm64-cross libgcc-s1-arm64-cross

      - name: Build Sovereign Payload
        run: |
          export QEMU_LD_PREFIX=/usr/aarch64-linux-gnu
          ./scripts/build.sh

      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
