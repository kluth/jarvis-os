name: Build JARVIS OS

on:
  push:
    branches: [ "main", "develop", "feat/*" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        toolchain: nightly
        components: rust-src, llvm-tools-preview
        override: true

    - name: Install QEMU
      run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

    - name: Run Integration Tests (QEMU)
      run: |
        # Build the test kernel
        cargo build --test basic_boot --target x86_64-jarvis_os.json \
          -Zbuild-std=core,alloc \
          -Zbuild-std-features=compiler-builtins-mem \
          -Zjson-target-spec
        
        # Find the compiled test binary
        TEST_BIN=$(find target/x86_64-jarvis_os/debug/deps -name "basic_boot-*" -type f -executable | head -n 1)
        echo "Found test binary at: $TEST_BIN"
        
        # Run create_image as runner for the test binary
        cargo run --bin create_image --target x86_64-unknown-linux-gnu -- "$TEST_BIN"

    - name: Build Production Kernel
      run: |
        cargo build --bin jarvis-kernel --target x86_64-jarvis_os.json \
          -Zbuild-std=core,alloc \
          -Zbuild-std-features=compiler-builtins-mem \
          -Zjson-target-spec

    - name: Create Production Disk Image
      run: |
        cargo run --bin create_image --target x86_64-unknown-linux-gnu

    - name: Upload Disk Image
      uses: actions/upload-artifact@v4
      with:
        name: jarvis-os-image
        path: target/image/jarvis-os.img
