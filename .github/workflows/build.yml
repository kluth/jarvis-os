name: Build & Verify JARVIS OS

on:
  push:
    branches: [ "main", "develop", "feat/*" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ "main", "develop" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: JRV Validation (Formal Proofs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies (QEMU & AArch64 Libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static libc6-arm64-cross libgcc-s1-arm64-cross

      - name: Run Validation Script (via QEMU)
        run: |
          export QEMU_LD_PREFIX=/usr/aarch64-linux-gnu
          ./scripts/validate.sh

  test:
    name: QEMU Integration Tests (${{ matrix.machine }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        machine: [q35, pc]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies (QEMU & AArch64 Libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-user-static libc6-arm64-cross libgcc-s1-arm64-cross

      - name: Build Sovereign Payload
        run: |
          export QEMU_LD_PREFIX=/usr/aarch64-linux-gnu
          # Need to make jrvc arch-aware or wrap it
          # For now, manually using qemu-aarch64-static -L /usr/aarch64-linux-gnu ./jrvc
          # Better: Update scripts/build.sh to be arch-aware like validate.sh
          ./scripts/build.sh

      - name: Run Integration Test
        run: |
          timeout 10s qemu-system-x86_64 \
            -kernel jarvis-os.img \
            -machine ${{ matrix.machine }} \
            -display none \
            -serial stdio || [ $? -eq 124 ]

  publish_ghcr:
    name: Publish to GHCR
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies (QEMU & AArch64 Libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static libc6-arm64-cross libgcc-s1-arm64-cross

      - name: Build Sovereign Payload
        run: |
          export QEMU_LD_PREFIX=/usr/aarch64-linux-gnu
          ./scripts/build.sh

      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
