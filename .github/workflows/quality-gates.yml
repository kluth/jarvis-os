name: 🧪 Quality Gates & Code Health

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check 2>&1 || echo "⚠ Format check failed (non-blocking)"

      - name: Clippy lint
        run: cargo clippy --all-targets 2>&1 | head -50 || echo "⚠ Clippy warnings found (non-blocking)"

      - name: Check for TODO/FIXME/HACK markers
        run: |
          echo "Checking for leftover development markers..."
          FOUND=$(grep -rn "TODO\|FIXME\|HACK\|XXX" --include='*.rs' --include='*.toml' . \
            --exclude-dir=target --exclude-dir=.git 2>/dev/null | grep -v "// Verified" | grep -v "TODO:" | head -20 || true)
          if [ -n "$FOUND" ]; then
            echo "⚠ Found markers:"
            echo "$FOUND"
          else
            echo "✅ No leftover markers found"
          fi

  code-stats:
    name: Code Statistics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count lines of code
        run: |
          echo "### 📊 JARVIS OS Codebase Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Language | Files | Lines |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|-------|" >> $GITHUB_STEP_SUMMARY
          
          for ext in rs toml sh json; do
            COUNT=$(find . -name "*.$ext" -not -path './target/*' -not -path './.git/*' 2>/dev/null | wc -l)
            LINES=$(find . -name "*.$ext" -not -path './target/*' -not -path './.git/*' -exec cat {} + 2>/dev/null | wc -l)
            echo "| .$ext | $COUNT | $LINES |" >> $GITHUB_STEP_SUMMARY
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          RUST_TESTS=$(grep -rn "#\[test\]" --include='*.rs' . --exclude-dir=target 2>/dev/null | wc -l)
          echo "**Rust tests:** $RUST_TESTS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Check for missing ADRs
        run: |
          echo "### 📋 ADR Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          mkdir -p docs/adrs
          ADRS=$(ls docs/adrs/*.md 2>/dev/null | wc -l)
          echo "**Architecture Decision Records:** $ADRS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for adr in docs/adrs/*.md; do
            if [ -f "$adr" ]; then
              TITLE=$(head -1 "$adr" 2>/dev/null | sed 's/^# //' || echo "$(basename "$adr")")
              echo "- $(basename "$adr"): $TITLE" >> $GITHUB_STEP_SUMMARY
            fi
          done
