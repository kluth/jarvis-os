name: Stability Soak Testing

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  schedule:
    - cron: '0 0 * * *' # Nightly full soak test

jobs:
  soak-test:
    name: Parallel Soak Test (Runner ${{ matrix.instance }})
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '#soak'))
    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2, 3, 4, 5]
    
    steps:
    - uses: actions/checkout@v4

    - name: Install NASM & QEMU
      run: sudo apt-get update && sudo apt-get install -y nasm qemu-system-x86

    - name: Build Disk Image
      run: |
        nasm -f bin boot.asm -o boot.bin
        # Create a 1.44MB floppy image
        dd if=/dev/zero of=jarvis-os.img bs=1024 count=1440
        dd if=boot.bin of=jarvis-os.img conv=notrunc

    - name: Run Stability Watchdog
      run: ./scripts/stability-watchdog.sh 600 jarvis-os.img

    - name: Archive Stability Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stability-log-instance-${{ matrix.instance }}
        path: stability.log
