name: Stability Soak Testing

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  schedule:
    - cron: '0 0 * * *' # Nightly full soak test

jobs:
  soak-test:
    name: Parallel Soak Test (Runner ${{ matrix.instance }})
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.body, '#soak'))
    strategy:
      fail-fast: false
      matrix:
        instance: [1, 2, 3, 4, 5]
    
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        components: rust-src, llvm-tools-preview

    - name: Install QEMU
      run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

    - name: Build Kernel
      run: |
        cargo build --bin jarvis-kernel --target x86_64-jarvis_os.json \
          -Zbuild-std=core,alloc -Zbuild-std-features=compiler-builtins-mem -Zjson-target-spec

    - name: Create Disk Image
      run: |
        cd image-builder
        cargo run --target x86_64-unknown-linux-gnu -- \
          ../target/x86_64-jarvis_os/debug/jarvis-kernel --no-run

    - name: Run Stability Watchdog
      run: ./scripts/stability-watchdog.sh 600 target/image/jarvis-os.img
      env:
        RUST_BACKTRACE: 1

    - name: Archive Stability Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stability-log-instance-${{ matrix.instance }}
        path: stability.log
