[package]
name = "jarvis-kernel"
version = "0.1.0"
edition = "2021"
resolver = "2"
authors = ["JARVIS Project"]

[lib]
name = "jarvis_kernel"
path = "src/lib.rs"
test = false
harness = false

[[bin]]
name = "jarvis-kernel"
path = "src/main.rs"
test = false
harness = false

[dependencies]
bootloader_api = { version = "0.11.15", default-features = false }
spinning_top = "=0.3.0"
lazy_static = { version = "=1.4.0", features = ["spin_no_std"] }
font8x8 = { version = "=0.3.1", default-features = false, features = ["unicode"], optional = true }
x86_64 = "=0.14.13"
linked_list_allocator = "=0.10.6"
uart_16550 = "=0.3.2"
crossbeam-queue = { version = "=0.3.12", default-features = false, features = ["alloc"] }
conquer-once = { version = "=0.4.0", default-features = false }
futures-util = { version = "=0.3.32", default-features = false, features = ["alloc"] }
pc-keyboard = "=0.7.0"
pic8259 = "=0.10.4"
x25519-dalek = { version = "2.0.0", default-features = false, features = ["static_secrets"] }
chacha20poly1305 = { version = "0.9.1", default-features = false, features = ["alloc"] }
poly1305 = { version = "0.7.2", default-features = false, features = ["force-soft"] }
rand_core = "0.6.4"
rand_chacha = { version = "0.3.1", default-features = false }

[features]
default = ["gui", "audio", "network", "ai", "storage", "telemetry"]
gui = ["font8x8"]
audio = []
network = []
ai = []
storage = []
telemetry = []
test = ["default"]

[dev-dependencies]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
strip = true
